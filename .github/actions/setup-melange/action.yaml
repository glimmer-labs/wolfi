name: 'Set melange docker action'
description: 'Sets up melange command using Docker'

runs:
  using: 'composite'
  steps:
    - name: Check Docker availability
      shell: bash
      run: |
        if ! command -v docker >/dev/null 2>&1; then
          echo "Docker is required but not available in PATH" >&2
          exit 1
        fi

    - name: Enable unprivileged user namespaces on the runner host
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0 || true
        echo "unprivileged_userns_clone=$(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
        echo "max_user_namespaces=$(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"

    - name: Pull melange image
      shell: bash
      run: |
        docker pull cgr.dev/chainguard/melange:latest

    - name: Create melange script
      shell: bash
      run: |
        cat <<'EOF' >/usr/local/bin/melange
        #!/usr/bin/env bash
        set -euo pipefail
        docker run --privileged --rm -i --user "$(id -u):$(id -g)" -v "${PWD}":/work cgr.dev/chainguard/melange "$@"
        EOF
        chmod +x /usr/local/bin/melange