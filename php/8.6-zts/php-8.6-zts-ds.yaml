package:
  name: php-8.6-zts-ds
  version: "2.0.0"
  epoch: 0
  description: "An extension providing efficient data structures for PHP"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ${{package.name}}-config
      - php-${{vars.phpMM}}-zts

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-zts-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - autoconf
      - build-base
      - busybox
      - php-${{vars.phpMM}}-zts
      - php-${{vars.phpMM}}-zts-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/php-ds/ext-ds
      tag: "v${{package.version}}"
      expected-commit: 533f11e1fc7e45e457e77d879f853bf5ec789f07
      cherry-picks: |
        master/25e0f3adb619670b5ba79afcfc1c9de745586550: fix PHP 8.6 compatibility
        master/de284b1a2c78a2d6974bc65bb449df59c002ec76: use zval_get_long_ex instead of zend_parse_parameter removed in 8.6

  - name: Prepare build
    runs: phpize

  - name: Build
    runs: |
      set -x
      ./configure

  - name: Make install
    runs: |
      INSTALL_ROOT="${{targets.destdir}}" DESTDIR="${{targets.destdir}}" make install

subpackages:
  - name: ${{package.name}}-config
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/etc/php/conf.d"
          echo "extension=ds.so" > "${{targets.subpkgdir}}/etc/php/conf.d/ds.ini"

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: php-ds/ext-ds
    strip-prefix: v
    tag-filter: v
    use-tag: true
